[build]
  command = "npm run build"
  publish = "dist"
  # ΦΡΕΝΟ ΚΟΣΤΟΥΣ (30/07/2026). Το Netlify Personal δίνει 1.000 credits/μήνα και κάθε
  # production deploy κοστίζει 15. Τα ~100 push στο `main` του Ιουλίου = ~1.500 credits,
  # δηλαδή το πακέτο τελείωνε στα δύο τρίτα του μήνα.
  #
  # Αυτή η εντολή τρέχει ΠΡΙΝ το build και το ακυρώνει όταν δεν χρειάζεται:
  #   · οτιδήποτε δεν είναι production (deploy preview, branch deploy) → ποτέ build
  #   · commits που αγγίζουν μόνο docs/, reports/, .github/ ή *.md → ποτέ build
  # Σε κάθε αμφιβολία χτίζει. Βλ. scripts/netlifyShouldSkipBuild.mjs.
  #
  # ΠΡΟΣΟΧΗ: αυτό ΔΕΝ αντικαθιστά τη ρύθμιση του dashboard. Το «Branch deploys: None»
  # και το «Deploy previews: off» (Site configuration → Build & deploy → Branches)
  # σταματάνε το deploy πριν καν ξεκινήσει build container — αυτό εδώ είναι το
  # δεύτερο, version-controlled δίχτυ που επιβιώνει αν κάποιος αλλάξει το dashboard.
  ignore = "node scripts/netlifyShouldSkipBuild.mjs"

# Edge-cached forecast proxy (capacity fix — see reports/capacity/capacity-model.md).
# Routes the client's ForecastProvider calls to the allow-list proxy function, which
# sets CDN cache headers so one upstream Open-Meteo call serves all users per TTL.
# Active in every context: VITE_FORECAST_PROXY_BASE is set below for production,
# deploy previews and branch deploys alike.
[[redirects]]
  from = "/api/forecast/*"
  to = "/.netlify/functions/forecast/:splat"
  status = 200

# First-party visitor counter (see netlify/functions/pageview.mjs). The client pings
# this clean, same-origin path so it is NOT on any ad-block filter list and needs no
# consent (cookieless, zero PII stored). This is what makes real traffic visible even
# when GA4 is blocked/declined.
[[redirects]]
  from = "/api/hit"
  to = "/.netlify/functions/pageview"
  status = 200

# Private traffic dashboard — real unique visitors/day. Gated by TRAFFIC_STATS_KEY.
[[redirects]]
  from = "/api/traffic"
  to = "/.netlify/functions/traffic-stats"
  status = 200

# Durable condition-feedback export (for scripts/calibrateFromFeedback.mjs). Gated by FEEDBACK_EXPORT_KEY.
[[redirects]]
  from = "/api/feedback-export"
  to = "/.netlify/functions/feedback-export"
  status = 200

# "Delete my account" (GDPR right to erasure). Authenticated by the caller's own
# access token — never by a user id in the request — and it deletes their stored
# files before the account row, because files are the part a cascade cannot redo.
[[redirects]]
  from = "/api/account-delete"
  to = "/.netlify/functions/account-delete"
  status = 200

# Supabase Database Webhook → "someone sent a photo" push, with approve/reject
# buttons. Gated by UGC_WEBHOOK_SECRET (unset ⇒ 403).
[[redirects]]
  from = "/api/ugc-hook"
  to = "/.netlify/functions/ugc-hook"
  status = 200

# The tap on those buttons comes back here. Two gates: Telegram's own
# secret_token header AND the presser's chat id — the button publishes content
# to a crawled page, so one gate was not enough.
[[redirects]]
  from = "/api/telegram-hook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200

# Moderation queue for visitor photos and reviews. Gated by UGC_ADMIN_KEY (unset ⇒
# 403). Nothing a visitor uploads is public until it is approved here — or from the
# Telegram buttons, which call the same lib/ugcModeration.mjs.
[[redirects]]
  from = "/api/ugc-admin"
  to = "/.netlify/functions/ugc-admin"
  status = 200

# "A photo just arrived" → Telegram. Called by the upload form right after a
# successful upload. It cannot be used to send arbitrary messages: it accepts a
# photo id plus the caller's Supabase token, and refuses unless that row really
# exists, really belongs to that user and is really still pending.
[[redirects]]
  from = "/api/ugc-notify"
  to = "/.netlify/functions/ugc-notify"
  status = 200

# What an uptime monitor should watch. NOT the homepage: that is a static file on
# a CDN and keeps returning 200 long after the functions behind the product have
# stopped. Unauthenticated on purpose — a monitor cannot log in.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Crash reports from the browser AND Content-Security-Policy violation reports.
# One sink for both: they are the same kind of event (the browser refused to do
# something) and want the same handling. Sends to Telegram, deduplicated per day.
[[redirects]]
  from = "/api/client-error"
  to = "/.netlify/functions/client-error"
  status = 200

[[redirects]]
  from = "/beaches/:region/:beach"
  to = "/beaches/:region/:beach/"
  status = 301

[[redirects]]
  from = "/beaches/:region"
  to = "/beaches/:region/"
  status = 301

# Baseline security headers on every response. Until 30/07/2026 the site sent
# none at all. These five are the no-risk set — they change nothing about how the
# page works, they only close off ways OTHER sites can abuse ours:
#   X-Frame-Options       — nobody can iframe us and overlay their own buttons
#   X-Content-Type-Options— stops a browser from "sniffing" a file into a script
#   Referrer-Policy       — outbound links (Google Maps, Commons) stop leaking the
#                           full URL of the beach page the visitor came from
#   Strict-Transport-Security — HTTPS only. Deliberately WITHOUT includeSubDomains
#                           and preload: both are effectively irreversible, and DNS
#                           is on Cloudflare where a future subdomain may not have
#                           a certificate on day one.
#   Permissions-Policy    — hands back camera/mic/payment, which we never use.
#                           geolocation is listed as (self) ON PURPOSE — "Κοντά μου"
#                           needs it; omitting the header entirely would also work,
#                           but then a future third-party script could ask for it.
#
# The Content-Security-Policy is REPORT-ONLY on purpose, and must stay that way
# until the reports have been silent for a few days.
#
# A CSP is the one header that can take the site down without anything looking
# wrong to us: miss a single origin and the map, the photos or the analytics stop
# working for visitors while every page still returns 200. So it ships listening
# first — violations go to /api/client-error and land in Telegram alongside crash
# reports. Only after real traffic produces silence does this become
# `Content-Security-Policy`. Flip the header name, change nothing else.
#
# Sources were enumerated from the code on 30/07/2026, not guessed:
#   script-src   googletagmanager (GA4, injected in analyticsService.ts)
#   img-src      https: — beach photos come from commons.wikimedia.org (which 302s
#                to upload.wikimedia.org), live.staticflickr.com, images.pexels.com,
#                images.unsplash.com and cdn.pixabay.com, plus map tiles from
#                {a,b,c}.tile.openstreetmap.org and server.arcgisonline.com. A named
#                list would be six entries that silently break an image the first
#                time a photo is added from somewhere new; images are also the least
#                dangerous thing to allow broadly.
#                `blob:` added 08/08/2026 for the upload sheet: the photo preview is a
#                canvas-encoded Blob shown through URL.createObjectURL, so without it
#                the visitor would pick a photo and see nothing the day this header
#                stops being report-only. It is a same-document source, not a network
#                one — it cannot fetch anything.
#   connect-src  GA4 collection endpoints, plus the Open-Meteo hosts which are only
#                reached directly under `vite dev` (production goes through
#                same-origin /api/forecast).
#   'unsafe-inline' for styles is UNAVOIDABLE: prerenderBeachPages.mjs emits 138
#                inline style="" attributes (97 land on a single beach page) and
#                index.html carries an inline <style>. Hashes cannot cover
#                attributes. Script inline is the small bootstrap in index.html.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
#
# ENFORCING since 31/07/2026. It sat in Report-Only because nobody could say what
# would break; that is now measured rather than assumed — `npm run quality:csp-coverage`
# scans the BUILT artifact, not the source. 1.337 external origins in dist/, 1.310
# covered, and the 27 that are not are every one an <a href> (camping sites inside the
# beach data, a Creative Commons licence URL) — CSP governs loads, not links. Checked
# separately: no absolute-URL fetch() anywhere in the bundle, so nothing reaches a host
# outside connect-src at runtime.
#
# `report-uri` stays deliberately. Enforcing does not stop reporting, so anything the
# artifact scan could not see — a URL assembled at runtime — still arrives in Telegram
# via /api/client-error instead of failing silently.
#
# ROLLBACK IS ONE WORD: put `-Report-Only` back on the header name and redeploy.
# 04/08/2026 — `https://www.googletagmanager.com` ADDED TO connect-src. It was in
# script-src (the tag loads) but not connect-src (the tag could not report), and GA4
# now sends part of its traffic to https://www.googletagmanager.com/td?id=G-… instead
# of the *.google-analytics.com collector. Enforcing CSP was therefore DROPPING real
# pageviews: caught by an enforced violation from /el/beaches/lakonia/1552-viandini-vourkos/.
# This is the failure mode the comment above warned about — one missing origin, every
# page still returning 200. Strictly a loosening; nothing that worked can break.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.open-meteo.com https://marine-api.open-meteo.com https://fbonloqkzgzwvhkbnktv.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/client-error"

# Content-hashed build assets (Vite emits everything under /assets/ with a hash
# in the filename, so each URL is immutable). Cache them for a year so the
# 199 KB CSS/JS bundles are not re-validated on every page navigation — that
# round-trip was making the static guide/region pages slow to open. A new build
# produces new hashes, so this never serves stale code.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached long, or behaviour changes won't reach
# clients. Keep it always-revalidated.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Landing hero photos (avif/webp from scripts/buildLandingHeroAssets.mjs).
# CAUTION: filenames are `<slot>-<crop>-<width>.<ext>` — NOT content-hashed. If
# a source photo is ever swapped, re-running the script overwrites these same
# filenames with different bytes, and this `immutable` header will keep any
# CDN/browser serving the stale image for up to a year. Bump the filename
# scheme (e.g. add a version suffix) in the script BEFORE swapping a source
# photo, or drop `immutable` if that discipline can't be guaranteed.
[[headers]]
  for = "/landing/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Forecast edge proxy — LIVE IN PRODUCTION since 2026-07-27 (Step 3 of
# reports/capacity/activation-runbook.md).
#
# WHY IT WAS FLIPPED: Open-Meteo's free tier counts requests PER IP. With the direct
# path, every visitor spent their OWN daily allowance — fine for one person on one
# connection, but anyone sharing an IP (carrier-grade NAT on mobile, an office, a
# hotel) pooled it, and once that pool hit ~10k the live site answered 429 and showed
# «Δεν ήταν δυνατή η ανανέωση των δεδομένων καιρού» with no way for the visitor to
# fix it. Observed on 2026-07-27 against production. Through the proxy the request
# originates from Netlify, so no visitor can be rate-limited by their neighbours.
#
# WHAT PROTECTS THE SHARED QUOTA: the function sets Netlify-CDN-Cache-Control
# (weather 3600 / marine 10800, see CDN_MAX_AGE_S there for the per-route reasoning),
# so the edge answers repeats and upstream load scales with DISTINCT
# BEACHES rather than with visitors — the whole point of capacity-model.md. The
# capacity alarm in the function (amber 5k / red 7k / any 429 → Telegram) is now the
# thing to watch; it was previously metering preview traffic only.
#
# ROLLBACK IS ONE LINE: delete the VITE_FORECAST_PROXY_BASE line below and redeploy.
# ForecastProvider falls straight back to calling Open-Meteo directly.
[context.production.environment]
  VITE_FORECAST_PROXY_BASE = "/api/forecast"

# Previews and branch deploys have carried the proxy since before go-live, so a
# preview keeps exercising the same path production now uses.
[context.deploy-preview.environment]
  VITE_FORECAST_PROXY_BASE = "/api/forecast"
  # Non-production: disables GA (services/analyticsService.ts gate) and triggers the
  # noindex/robots/ribbon guards (scripts/applyDeployContextGuards.mjs) at build end.
  VITE_APP_ENV = "preview"

# Branch deploys are our DEV / STAGING environment: push any non-`main` branch (we
# recommend a long-lived `dev` branch) and Netlify serves it at <branch>--<site>.netlify.app,
# fully isolated from production. VITE_APP_ENV="staging" keeps GA off and the deploy noindex.
# See docs/DEV-ENVIRONMENT.md.
[context.branch-deploy.environment]
  VITE_FORECAST_PROXY_BASE = "/api/forecast"
  VITE_APP_ENV = "staging"

[build.environment]
  # Match the local/CI toolchain (local dev and quality.yml both run Node 22)
  # so Netlify builds are byte-comparable with local clean-worktree builds.
  NODE_VERSION = "22"
  # Deploy environment. Production (`main`) keeps this "production" so GA stays live
  # and the site stays indexable; deploy-preview and branch-deploy contexts override
  # it above to disable analytics and force noindex.
  VITE_APP_ENV = "production"
  # Google Analytics 4 Measurement ID. Pinned here (not a secret — it ships in the
  # client bundle anyway) so it's version-controlled and immune to dashboard typos.
  # netlify.toml takes precedence over the UI env var of the same name.
  VITE_GA_MEASUREMENT_ID = "G-Q0QWSEQN4R"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "true"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDOCAbC123dEf456GhI789jKl012-MnO,AIza...."
  # The former "node_modules/@firebase/**" exclusion is gone with the package: it
  # blinded the secret scanner to a whole subtree by PATH rather than by value,
  # which is the weakest kind of exemption. firebase was never imported by
  # anything and never reached the bundle — removing the dependency removed the
  # reason for the blind spot too. Do not reintroduce a path-based omission here
  # without a specific, documented reason.
